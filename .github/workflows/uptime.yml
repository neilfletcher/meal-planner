name: Uptime check

# Every 15 minutes, checks the site, a recipe page, the planner and the
# server's settings (Firebase and Stripe). When something breaks, this run
# fails and GitHub emails you. While it stays broken, later runs pass quietly
# (with a warning) so you get one email per problem, plus a reminder every
# 6 hours until it's fixed.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Last known state
        uses: actions/cache/restore@v4
        with:
          path: uptime-state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check the site
        id: check
        env:
          SITE: ${{ vars.SITE_URL || 'https://solosupper.co.uk' }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const SITE = process.env.SITE.replace(/\/+$/, '');
          const checks = [
            ['Home page', '/', (r, t) => r.status === 200 && /Solo Supper/.test(t)],
            ['A recipe page', '/recipes/russian-style-beef-stroganoff/', (r, t) => r.status === 200 && /Stroganoff/.test(t)],
            ['The planner', '/plan/', (r, t) => r.status === 200 && /app\.js/.test(t)],
            ['Recipe data', '/recipes-data.js', (r, t) => r.status === 200 && /SOLO_RECIPES/.test(t)],
            ['Server settings', '/api/health', (r, t) => {
              if (r.status !== 200) return false;
              const j = JSON.parse(t);
              const bad = [];
              if (j.firebaseServiceAccount !== true) bad.push('Firebase service account');
              if (!j.stripeSecretKey) bad.push('Stripe secret key');
              else if (j.stripeSecretKey !== 'live') console.log('::warning::Stripe is using a test key, so nobody can actually pay.');
              if (!j.stripeWebhookSecret) bad.push('Stripe webhook secret');
              if (!j.prices || !j.prices.annual || !j.prices.monthly) bad.push('Stripe prices');
              if (bad.length) throw new Error(bad.join(', '));
              return true;
            }]
          ];
          (async () => {
            const problems = [];
            for (const [name, path, ok] of checks) {
              let last = '';
              for (let attempt = 0; attempt < 2; attempt++) {
                try {
                  const r = await fetch(SITE + path, { redirect: 'follow', signal: AbortSignal.timeout(20000), headers: { 'user-agent': 'SoloSupperUptime/1' } });
                  const t = await r.text();
                  if (ok(r, t)) { last = ''; break; }
                  last = 'HTTP ' + r.status;
                } catch (e) { last = e.message; }
                await new Promise(res => setTimeout(res, 5000));
              }
              if (last) problems.push(name + ' (' + path + '): ' + last);
            }
            let prev = { down: false, alertedAt: 0 };
            try { prev = JSON.parse(fs.readFileSync('uptime-state.json', 'utf8')); } catch (e) {}
            const now = Date.now();
            const state = { down: problems.length > 0, alertedAt: prev.alertedAt || 0, problems, at: now };
            let alert = false;
            if (problems.length) {
              if (!prev.down || now - (prev.alertedAt || 0) > 6 * 3600e3) { alert = true; state.alertedAt = now; }
              problems.forEach(p => console.log('::error::' + p));
            } else {
              if (prev.down) console.log('::notice::Solo Supper is back up.');
              state.alertedAt = 0;
              console.log('All checks passed.');
            }
            fs.writeFileSync('uptime-state.json', JSON.stringify(state));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'alert=' + (alert ? 'yes' : 'no') + '\n');
            if (problems.length && !alert) console.log('::warning::Still down; you were emailed already.');
          })();
          JS

      - name: Remember the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: uptime-state.json
          key: uptime-state-${{ github.run_id }}

      - name: Email me (fail this run)
        if: steps.check.outputs.alert == 'yes'
        run: |
          echo "::error::Solo Supper has a problem. See the errors above."
          exit 1
