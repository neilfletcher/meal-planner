# Copy this file to .github/workflows/social-weekly.yml (see scripts/social/README.md).
name: Social autopilot

on:
  schedule:
    - cron: "0 6 * * 6"   # Saturdays at 06:00 UTC: makes next week's posts, then any extras due
    - cron: "0 6 * * 3"   # Wednesdays at 06:00 UTC: extras only (scripts/social/campaigns.js), as a second chance
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = make the posts only; publish = make and queue in Buffer; queue-existing = queue a week already made; check-buffer = read Buffer settings only; extras = only the dated extras due in the next 10 days"
        type: choice
        options: [preview, publish, queue-existing, check-buffer, extras]
        default: preview
      week:
        description: "Monday of the week, YYYY-MM-DD (blank = next Monday)"
        required: false
      layout:
        description: "weekly = 7 pins, a carousel and a video; launch = one-off week with Instagram daily and 3 pins"
        type: choice
        options: [weekly, launch]
        default: weekly

permissions:
  contents: write
  issues: write

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  social:
    if: github.event.schedule != '0 6 * * 3' && inputs.mode != 'extras'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode || (vars.SOCIAL_AUTOPUBLISH == 'true' && 'publish' || 'preview') }}
      WEEK_INPUT: ${{ inputs.week }}
      SOCIAL_LAYOUT: ${{ inputs.layout || 'weekly' }}
      MEDIA_BASE: ${{ vars.SOCIAL_MEDIA_BASE || 'https://social-media.solo-supper.pages.dev' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SOCIAL_USE_VEO: ${{ vars.SOCIAL_USE_VEO }}
      SOCIAL_AI_LABEL: ${{ vars.SOCIAL_AI_LABEL }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Work out the week
        run: |
          if [ -n "$WEEK_INPUT" ]; then WEEK="$WEEK_INPUT"; else WEEK=$(node -e "console.log(require('./scripts/social/util.js').nextMonday(new Date()))"); fi
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"
          echo "Mode: $MODE, week of $WEEK"

      - name: Get the media branch
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" social-media >/dev/null; then
            git clone --depth 1 --branch social-media "$URL" media
          else
            mkdir media && git -C media init -q -b social-media && git -C media remote add origin "$URL"
          fi

      - name: Skip a week that is already in Buffer
        run: |
          RUN="$MODE"
          M="media/$WEEK/manifest.json"
          if [ -f "$M" ] && grep -q '"queuedAt"' "$M"; then
            if [ "$MODE" = "preview" ] || [ "$MODE" = "publish" ]; then
              echo "::notice::The week of $WEEK is already queued in Buffer, so it is not made again. Use queue-existing to retry any failed posts."
              RUN=queue-existing
              [ "$MODE" = "preview" ] && RUN=skip
            fi
          fi
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          echo "Mode: $MODE, running as: $RUN"

      - name: Install tools
        if: env.RUN == 'preview' || env.RUN == 'publish'
        run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          cd scripts/social && npm install --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Make the posts
        if: env.RUN == 'preview' || env.RUN == 'publish'
        run: node scripts/social/make-week.js --out media --week "$WEEK"

      - name: Save media (social-media branch, last 5 weeks only)
        if: env.RUN == 'preview' || env.RUN == 'publish'
        run: |
          cd media
          CUTOFF=$(date -u -d '35 days ago' +%F)
          for d in 20*-*-*; do [ -d "$d" ] && [[ "$d" < "$CUTOFF" ]] && rm -rf "$d"; done
          git config user.name "Solo Supper autopilot"; git config user.email "hello@solosupper.co.uk"
          git checkout -q --orphan fresh
          git add -A && git commit -q -m "Social media for the week of $WEEK"
          git branch -M social-media && git push -q -f origin social-media

      - name: Save history and links page (main)
        if: env.RUN == 'preview' || env.RUN == 'publish'
        run: |
          git config user.name "Solo Supper autopilot"; git config user.email "hello@solosupper.co.uk"
          git add social/history.json links/index.html
          git diff --cached --quiet || (git commit -q -m "Social posts for the week of $WEEK" && git pull -q --rebase && git push -q)

      - name: Check Buffer
        if: env.RUN == 'check-buffer'
        run: node scripts/social/publish-week.js --media media --check

      - name: Queue in Buffer
        if: env.RUN == 'publish' || env.RUN == 'queue-existing'
        run: node scripts/social/publish-week.js --media media --week "$WEEK"

      - name: Save Buffer results
        if: always() && env.RUN != 'preview'
        run: |
          cd media
          git config user.name "Solo Supper autopilot"; git config user.email "hello@solosupper.co.uk"
          git add -A
          git diff --cached --quiet || (git commit -q -m "Buffer results for the week of $WEEK" && git push -q origin HEAD:social-media)

      - name: Weekly summary issue
        if: env.RUN == 'preview' || env.RUN == 'publish'
        run: |
          TITLE="Social posts for the week of $WEEK"
          if [ "$RUN" = "preview" ]; then NOTE="**Preview only:** nothing has been queued. To queue these posts, run the Social autopilot workflow with mode queue-existing and week $WEEK."; else NOTE="**Queued in Buffer.** Edit or delete anything in the Buffer app before it goes out."; fi
          { echo "$NOTE"; echo; cat "media/$WEEK/issue.md"; } > /tmp/issue.md
          gh issue create --title "$TITLE" --body-file /tmp/issue.md

  # The dated extra posts (cookbooks, Christmas) in scripts/social/campaigns.js:
  # each is made and queued in Buffer in the 10 days before it is due, by the
  # Saturday run and again on Wednesday, so a missed or failed run is picked up.
  # Posts already queued are left alone.
  extras:
    needs: social
    if: always() && (github.event_name == 'schedule' || inputs.mode == 'extras' || inputs.mode == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ (inputs.mode == 'extras' || inputs.mode == 'publish' || vars.SOCIAL_AUTOPUBLISH == 'true') && 'yes' || 'no' }}
      MEDIA_BASE: ${{ vars.SOCIAL_MEDIA_BASE || 'https://social-media.solo-supper.pages.dev' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Get the media branch
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch social-media "$URL" media
      - name: Install tools
        run: cd scripts/social && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Make the extras due soon
        run: |
          node scripts/social/make-extras.js --out media --days 10
          echo "Due: $(tr '\n' ' ' < media/extras-due.txt)"
      - name: Save media (social-media branch)
        run: |
          cd media
          git config user.name "Solo Supper autopilot"; git config user.email "hello@solosupper.co.uk"
          git add -A -- . ':!extras-due.txt'
          git diff --cached --quiet || (git commit -q -m "Extra posts" && git push -q origin HEAD:social-media)
      - name: Queue in Buffer
        if: env.PUBLISH == 'yes'
        run: |
          FAILED=0
          while read -r F; do
            [ -n "$F" ] || continue
            node scripts/social/publish-week.js --media media --week "$F" || FAILED=1
          done < media/extras-due.txt
          exit $FAILED
      - name: Save Buffer results
        if: always() && env.PUBLISH == 'yes'
        run: |
          cd media
          git config user.name "Solo Supper autopilot"; git config user.email "hello@solosupper.co.uk"
          git add -A -- . ':!extras-due.txt'
          git diff --cached --quiet || (git commit -q -m "Buffer results for extra posts" && git push -q origin HEAD:social-media)
