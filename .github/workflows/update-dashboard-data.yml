name: Update dashboard data

on:
  schedule:
    # Every hour, at 17 minutes past (GA4's own reports update every few hours,
    # so more often than this adds Firestore reads without fresher numbers).
    # Sign-ups, subscriptions and visitors on the site now are live on the page.
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Fetch dashboard data
        working-directory: scripts
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run fetch

    
